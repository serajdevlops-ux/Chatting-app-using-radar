<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OffGrid Radar Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .radar-sweep {
            background: conic-gradient(from 0deg at 50% 50%, rgba(34, 197, 94, 0) 0deg, rgba(34, 197, 94, 0.4) 360deg);
            animation: sweep 4s linear infinite;
        }
        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse-ring {
            animation: pulse-out 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-out {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-green-400 font-mono h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Bar -->
    <header class="bg-slate-900 border-b border-green-500/30 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <h1 class="text-lg font-bold tracking-widest text-green-400">RADAR_LINK // OFFLINE</h1>
        </div>
        <div id="status" class="text-xs text-green-600 bg-green-950/50 px-2 py-1 rounded border border-green-800">
            INITIALIZING...
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative flex flex-col items-center justify-center p-4">
        
        <!-- Radar Screen Container -->
        <div id="radar-container" class="relative w-80 h-80 sm:w-96 sm:h-96 rounded-full border-2 border-green-500/40 bg-black/60 flex items-center justify-center shadow-[0_0_30px_rgba(34,197,94,0.15)] overflow-hidden">
            
            <!-- Radar Grid Rings -->
            <div class="absolute w-3/4 h-3/4 rounded-full border border-green-500/20"></div>
            <div class="absolute w-2/4 h-2/4 rounded-full border border-green-500/20"></div>
            <div class="absolute w-1/4 h-1/4 rounded-full border border-green-500/20"></div>
            
            <!-- Crosshairs -->
            <div class="absolute w-full h-[1px] bg-green-500/20"></div>
            <div class="absolute h-full w-[1px] bg-green-500/20"></div>

            <!-- Sweeper -->
            <div class="absolute inset-0 rounded-full radar-sweep pointer-events-none"></div>

            <!-- Center Node (You) -->
            <div class="absolute w-3 h-3 bg-green-400 rounded-full shadow-[0_0_10px_#22c55e] z-10"></div>
            <div class="absolute w-6 h-6 rounded-full border border-green-400 pulse-ring pointer-events-none"></div>

            <!-- Dynamic Nearby Real Hardware Nodes Layer -->
            <div id="nodes-layer" class="absolute inset-0"></div>
        </div>

        <div class="mt-6 text-center text-xs text-green-600">
            TAP A BLIP TO ESTABLISH SECURE P2P CONNECTION
        </div>
    </main>

    <!-- Chat Modal / Drawer -->
    <div id="chat-modal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col z-50 transform translate-y-full transition-transform duration-300">
        <!-- Chat Header -->
        <div class="bg-slate-900 border-b border-green-500/30 p-4 flex justify-between items-center">
            <div>
                <span class="text-xs text-green-600 block">SECURE CHANNEL</span>
                <h2 id="chat-peer-name" class="font-bold text-green-400">Node_Unknown</h2>
            </div>
            <button onclick="closeChat()" class="text-green-500 hover:text-green-300 px-3 py-1 border border-green-500/40 rounded text-sm">
                [CLOSE]
            </button>
        </div>

        <!-- Messages History -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
            <div class="text-center text-xs text-green-700 my-2">— P2P tunnel initialized locally —</div>
        </div>

        <!-- Chat Input Form -->
        <form onsubmit="sendMessage(event)" class="bg-slate-900 border-t border-green-500/30 p-3 flex gap-2">
            <input type="text" id="message-input" autocomplete="off" placeholder="Type transmission..." 
                class="flex-1 bg-black border border-green-500/40 rounded px-3 py-2 text-green-400 focus:outline-none focus:border-green-400 text-sm">
            <button type="submit" class="bg-green-950 border border-green-500 text-green-400 px-4 py-2 rounded font-bold hover:bg-green-900 transition-colors text-sm">
                SEND
            </button>
        </form>
    </div>

    <!-- Bluetooth Hardware Radar Logic -->
    <script type="module">
        import { BleClient } from 'https://esm.run/@capacitor-community/bluetooth-le';

        let activePeers = [];
        let currentPeer = null;

        async function initBluetoothRadar() {
            try {
                document.getElementById('status').innerText = "INITIALIZING BT...";
                await BleClient.initialize();
                
                const enabled = await BleClient.isEnabled();
                if (!enabled) {
                    document.getElementById('status').innerText = "ENABLE BLUETOOTH!";
                    return;
                }

                document.getElementById('status').innerText = "SCANNING DEVICES...";

                // Request live BLE scan for physical devices
                await BleClient.requestLEScan({}, (result) => {
                    const deviceId = result.device.deviceId;
                    const name = result.device.name || 'Unknown Device';
                    const rssi = result.rssi; // Signal strength (e.g., -40 to -90)

                    // Map RSSI to radar coordinates
                    const distanceFactor = Math.min(Math.max((rssi + 90) / 60, 0.1), 0.9);
                    const angle = Math.random() * 2 * Math.PI; 
                    const x = 50 + (distanceFactor * 40 * Math.cos(angle));
                    const y = 50 + (distanceFactor * 40 * Math.sin(angle));

                    const existing = activePeers.find(p => p.id === deviceId);
                    if (existing) {
                        existing.rssi = `${rssi} dBm`;
                        existing.x = x;
                        existing.y = y;
                    } else {
                        activePeers.push({ id: deviceId, name: name, x: x, y: y, rssi: `${rssi} dBm` });
                    }

                    renderRadarNodes();
                    document.getElementById('status').innerText = `ONLINE (${activePeers.length} NODES)`;
                });

            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "SCAN ERROR (PERMS)";
            }
        }

        function renderRadarNodes() {
            const layer = document.getElementById('nodes-layer');
            layer.innerHTML = '';

            activePeers.forEach(peer => {
                const node = document.createElement('div');
                node.className = 'absolute w-4 h-4 -ml-2 -mt-2 bg-green-400 rounded-full cursor-pointer flex items-center justify-center group animate-pulse shadow-[0_0_8px_#22c55e]';
                node.style.left = `${peer.x}%`;
                node.style.top = `${peer.y}%`;
                
                node.innerHTML = `
                    <div class="absolute bottom-5 bg-black/80 border border-green-500/50 text-[10px] px-1.5 py-0.5 rounded whitespace-nowrap text-green-300 pointer-events-none">
                        ${peer.name} (${peer.rssi})
                    </div>
                `;

                node.onclick = () => window.openChat(peer);
                layer.appendChild(node);
            });
        }

        // Global UI handlers for chat modal
        window.openChat = function(peer) {
            currentPeer = peer;
            document.getElementById('chat-peer-name').innerText = `${peer.name} [${peer.rssi}]`;
            document.getElementById('chat-messages').innerHTML = `<div class="text-center text-xs text-green-700 my-2">— Connected to ${peer.name} —</div>`;
            document.getElementById('chat-modal').classList.remove('translate-y-full');
        };

        window.closeChat = function() {
            document.getElementById('chat-modal').classList.add('translate-y-full');
            currentPeer = null;
        };

        window.sendMessage = function(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML += `
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-green-600">YOU</span>
                    <div class="bg-green-950/60 border border-green-500/40 rounded p-2 max-w-[80%] text-green-300">${escapeHtml(text)}</div>
                </div>
            `;
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Start hardware scanning on app startup
        window.onload = () => {
            initBluetoothRadar();
        };
    </script>
</body>
</html>
