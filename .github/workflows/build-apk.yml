name: Build HTML to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Project & Build APK
        run: |
          # Create default package.json
          npm init -y
          
          # Install Capacitor core, CLI, and Android platform
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Initialize Capacitor configuration pointing to your 'www' folder
          npx cap init "RadarChat" "com.radar.chat" --web-dir www
          
          # Add the Android native platform template
          npx cap add android
          
          # Build the APK via Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
